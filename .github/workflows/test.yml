name: test

on: [push, pull_request]

jobs:
  selftest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build + selftest
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -DMETAL_SELFTEST -o /tmp/split hooks/split.cpp
          /tmp/split --selftest
      - name: fails open on garbage
        run: |
          c++ -std=c++20 -O2 -o /tmp/hook hooks/split.cpp
          echo 'not json' | /tmp/hook
          echo '{}' | /tmp/hook
          test -z "$(echo 'not json' | /tmp/hook)"
      - name: manifests parse
        run: python3 -c "import json;[json.load(open(p)) for p in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json']]"
      - name: hooks obey their own rule
        run: |
          for f in hooks/split.cpp hooks/hookjson.hpp hooks/selftest.inc; do
            n=$(wc -l < "$f"); echo "$f: $n"; test "$n" -le 300
          done
