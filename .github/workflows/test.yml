name: test

on: [push, pull_request]

jobs:
  selftest:
    strategy:
      fail-fast: false  # libstdc++ and libc++ disagree often enough that one must not hide the other
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build + selftest
        run: |
          METAL_SELFTEST=1 sh build.sh /tmp/split
          /tmp/split --selftest
      - name: fails open on garbage
        run: |
          sh build.sh /tmp/hook
          echo 'not json' | /tmp/hook
          echo '{}' | /tmp/hook
          test -z "$(echo 'not json' | /tmp/hook)"
      - name: manifests parse
        run: python3 -c "import json;[json.load(open(p)) for p in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json']]"
      - name: hooks obey their own rule
        run: |
          for f in hooks/*.cpp hooks/*.hpp hooks/*.inc; do
            n=$(wc -l < "$f"); echo "$f: $n"; test "$n" -le 300
          done
